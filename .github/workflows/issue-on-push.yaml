name: Create Issue on Push
on: push

permissions:
  issues: write

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues" \
            -f title="Push detected on $GITHUB_REF_NAME" \
            -f body="Commit: $GITHUB_SHA" \
            --jq '.html_url'
